<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Learn Hub</title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

</head>


<body>


<header>

  <h1>Learn Hub</h1>

  <p>Learn • Teach • Grow</p>

</header>


<main class="container">


  <!-- Welcome -->

  <section class="card">

    <h2>Welcome to Learn Hub</h2>

    <p>
      An online learning platform for
      students and teachers.
    </p>

  </section>


  <!-- Login -->

  <section class="card">

    <h2>Sign In</h2>


    <form id="loginForm">


      <label>

        Email

        <input
          type="email"
          id="loginEmail"
          placeholder="Enter your email"
          required
        >

      </label>


      <label>

        Password

        <input
          type="password"
          id="loginPassword"
          placeholder="Enter your password"
          required
        >

      </label>


      <button
        type="submit"
        id="loginBtn"
      >

        Sign In

      </button>


    </form>


    <p id="loginMessage"></p>

  </section>


  <!-- Register -->

  <section class="card">

    <h2>Create Account</h2>


    <form id="registerForm">


      <label>

        Full Name

        <input
          type="text"
          id="registerName"
          placeholder="Enter your full name"
          required
        >

      </label>


      <label>

        Email

        <input
          type="email"
          id="registerEmail"
          placeholder="Enter your email"
          required
        >

      </label>


      <label>

        Password

        <input
          type="password"
          id="registerPassword"
          placeholder="Create a password"
          minlength="6"
          required
        >

      </label>


      <label>

        Account Type

        <select
          id="accountType"
          required
        >

          <option value="">
            Select Account Type
          </option>

          <option value="student">
            Student
          </option>

          <option value="teacher">
            Teacher
          </option>

        </select>

      </label>


      <button
        type="submit"
        id="registerBtn"
      >

        Create Account

      </button>


    </form>


    <p id="registerMessage"></p>

  </section>


</main>


<script type="module">


  import {
    auth,
    db
  }
  from "./firebase-config.js";


  import {
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword
  }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


  import {
    doc,
    setDoc
  }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  // ==============================
  // LOGIN ELEMENTS
  // ==============================

  const loginForm =
    document.getElementById(
      "loginForm"
    );


  const loginEmail =
    document.getElementById(
      "loginEmail"
    );


  const loginPassword =
    document.getElementById(
      "loginPassword"
    );


  const loginBtn =
    document.getElementById(
      "loginBtn"
    );


  const loginMessage =
    document.getElementById(
      "loginMessage"
    );


  // ==============================
  // REGISTER ELEMENTS
  // ==============================

  const registerForm =
    document.getElementById(
      "registerForm"
    );


  const registerName =
    document.getElementById(
      "registerName"
    );


  const registerEmail =
    document.getElementById(
      "registerEmail"
    );


  const registerPassword =
    document.getElementById(
      "registerPassword"
    );


  const accountType =
    document.getElementById(
      "accountType"
    );


  const registerBtn =
    document.getElementById(
      "registerBtn"
    );


  const registerMessage =
    document.getElementById(
      "registerMessage"
    );


  // ==============================
  // SIGN IN
  // ==============================

  loginForm.addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();


      loginBtn.disabled =
        true;


      loginBtn.textContent =
        "Signing In...";


      loginMessage.textContent =
        "";


      try {

        const result =
          await signInWithEmailAndPassword(

            auth,

            loginEmail.value.trim(),

            loginPassword.value

          );


        const user =
          result.user;


        loginMessage.textContent =
          "Login successful.";


        /*
          For now students and teachers
          can open their own dashboards
          manually.

          Later we can connect automatic
          role-based routing here.
        */


        setTimeout(
          () => {

            window.location.href =
              "student.html";

          },
          700
        );


      }

      catch (error) {

        console.error(
          error
        );


        loginMessage.textContent =
          getFirebaseError(
            error.code
          );

      }


      loginBtn.disabled =
        false;


      loginBtn.textContent =
        "Sign In";

    }
  );


  // ==============================
  // CREATE ACCOUNT
  // ==============================

  registerForm.addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();


      registerBtn.disabled =
        true;


      registerBtn.textContent =
        "Creating...";


      registerMessage.textContent =
        "";


      try {

        const result =
          await createUserWithEmailAndPassword(

            auth,

            registerEmail.value.trim(),

            registerPassword.value

          );


        const user =
          result.user;


        // Save account information

        await setDoc(

          doc(
            db,
            "users",
            user.uid
          ),

          {

            uid:
              user.uid,

            name:
              registerName.value.trim(),

            email:
              registerEmail.value.trim(),

            role:
              accountType.value,

            createdAt:
              new Date()

          }

        );


        // Also create student profile

        if (
          accountType.value ===
          "student"
        ) {

          await setDoc(

            doc(
              db,
              "students",
              user.uid
            ),

            {

              uid:
                user.uid,

              fullName:
                registerName.value.trim(),

              email:
                registerEmail.value.trim(),

              country:
                "Pakistan",

              createdAt:
                new Date()

            }

          );

        }


        registerMessage.textContent =
          "Account created successfully.";


        setTimeout(
          () => {

            if (
              accountType.value ===
              "teacher"
            ) {

              window.location.href =
                "teacher.html";

            }

            else {

              window.location.href =
                "student.html";

            }

          },
          800
        );

      }

      catch (error) {

        console.error(
          error
        );


        registerMessage.textContent =
          getFirebaseError(
            error.code
          );

      }


      registerBtn.disabled =
        false;


      registerBtn.textContent =
        "Create Account";

    }
  );


  // ==============================
  // FIREBASE ERROR MESSAGE
  // ==============================

  function getFirebaseError(
    code
  ) {

    switch (code) {

      case
        "auth/email-already-in-use":

        return "This email is already registered.";

      case
        "auth/invalid-email":

        return "Please enter a valid email.";

      case
        "auth/weak-password":

        return "Password must be at least 6 characters.";

      case
        "auth/invalid-credential":

        return "Email or password is incorrect.";

      case
        "auth/user-not-found":

        return "Account not found.";

      default:

        return "Something went wrong. Please try again.";

    }

  }


</script>


</body>

</html>
