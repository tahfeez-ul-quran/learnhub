<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Profile - Learn Hub</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .header {
      background: #2563eb;
      color: white;
      padding: 22px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin: 7px 0 0;
      opacity: 0.9;
    }

    .container {
      max-width: 650px;
      margin: 30px auto;
      padding: 0 18px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-top: 0;
      text-align: center;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd3df;
      border-radius: 9px;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #2563eb;
    }

    .save-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .save-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .logout-btn {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border: 1px solid #ddd;
      border-radius: 9px;
      background: white;
      font-size: 16px;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      text-align: center;
    }

    .success {
      display: block !important;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block !important;
      background: #fee2e2;
      color: #991b1b;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Learn Hub</h1>
    <p>Student Profile</p>
  </div>

  <div class="container">

    <div class="card">

      <h2>Create / Update Profile</h2>

      <form id="studentForm">

        <div class="field">
          <label for="fullName">Full Name</label>
          <input
            type="text"
            id="fullName"
            placeholder="Enter your full name"
            required
          >
        </div>

        <div class="field">
          <label for="dob">Date of Birth</label>
          <input
            type="date"
            id="dob"
            required
          >
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          >
        </div>

        <div class="field">
          <label for="phone">Phone Number</label>
          <input
            type="tel"
            id="phone"
            placeholder="Enter your phone number"
            required
          >
        </div>

        <div class="field">
          <label for="country">Country</label>
          <input
            type="text"
            id="country"
            placeholder="Enter your country"
            value="Pakistan"
            required
          >
        </div>

        <div class="field">
          <label for="language">Preferred Language</label>

          <select id="language" required>
            <option value="">Select Language</option>
            <option value="Urdu">Urdu</option>
            <option value="English">English</option>
            <option value="Pashto">Pashto</option>
            <option value="Punjabi">Punjabi</option>
          </select>
        </div>

        <button
          type="submit"
          class="save-btn"
          id="saveBtn"
        >
          Save Profile
        </button>

        <button
          type="button"
          class="logout-btn"
          id="logoutBtn"
        >
          Sign Out
        </button>

        <div id="message"></div>

      </form>

    </div>

  </div>


  <!-- Firebase -->
  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getFirestore,
      doc,
      setDoc,
      getDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    // ==========================================
    // FIREBASE CONFIGURATION
    // ==========================================

   // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAdWXljc4GS9kWcNUo-QTWIEF1Lzeo-owg",
  authDomain: "learn-hub-quran.firebaseapp.com",
  databaseURL: "https://learn-hub-quran-default-rtdb.firebaseio.com",
  projectId: "learn-hub-quran",
  storageBucket: "learn-hub-quran.firebasestorage.app",
  messagingSenderId: "795140160592",
  appId: "1:795140160592:web:f761eaa4043ad0e73f2555",
  measurementId: "G-6G90VGC6CC"
};


    // ==========================================
    // INITIALIZE FIREBASE
    // ==========================================

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    // ==========================================
    // ELEMENTS
    // ==========================================

    const form = document.getElementById("studentForm");

    const saveBtn = document.getElementById("saveBtn");

    const logoutBtn = document.getElementById("logoutBtn");

    const message = document.getElementById("message");


    // ==========================================
    // SHOW MESSAGE
    // ==========================================

    function showMessage(text, type) {

      message.textContent = text;

      message.className = type;

    }


    // ==========================================
    // AUTH CHECK
    // ==========================================

    let currentUser = null;

    onAuthStateChanged(auth, async (user) => {

      if (!user) {

        showMessage(
          "Please sign in first.",
          "error"
        );

        saveBtn.disabled = true;

        return;
      }

      currentUser = user;

      saveBtn.disabled = false;

      // Automatically use Firebase email
      if (user.email) {

        document.getElementById("email").value =
          user.email;

      }


      // Load existing profile
      await loadStudentProfile(user.uid);

    });


    // ==========================================
    // LOAD PROFILE
    // ==========================================

    async function loadStudentProfile(uid) {

      try {

        const studentRef =
          doc(db, "students", uid);

        const studentSnap =
          await getDoc(studentRef);


        if (studentSnap.exists()) {

          const data =
            studentSnap.data();


          document.getElementById("fullName").value =
            data.fullName || "";

          document.getElementById("dob").value =
            data.dob || "";

          document.getElementById("email").value =
            data.email || "";

          document.getElementById("phone").value =
            data.phone || "";

          document.getElementById("country").value =
            data.country || "Pakistan";

          document.getElementById("language").value =
            data.language || "";

        }

      } catch (error) {

        console.error(error);

        showMessage(
          "Could not load student profile.",
          "error"
        );

      }

    }


    // ==========================================
    // SAVE PROFILE
    // ==========================================

    form.addEventListener("submit", async (event) => {

      event.preventDefault();


      if (!currentUser) {

        showMessage(
          "Please sign in first.",
          "error"
        );

        return;

      }


      saveBtn.disabled = true;

      saveBtn.textContent = "Saving...";


      try {

        const profile = {

          uid: currentUser.uid,

          fullName:
            document.getElementById("fullName").value.trim(),

          dob:
            document.getElementById("dob").value,

          email:
            document.getElementById("email").value.trim(),

          phone:
            document.getElementById("phone").value.trim(),

          country:
            document.getElementById("country").value.trim(),

          language:
            document.getElementById("language").value,

          updatedAt:
            serverTimestamp()

        };


        const studentRef =
          doc(db, "students", currentUser.uid);


        await setDoc(
          studentRef,
          profile,
          { merge: true }
        );


        showMessage(
          "Student Profile saved successfully!",
          "success"
        );


      } catch (error) {

        console.error(
          "Firestore Error:",
          error
        );


        showMessage(
          "Profile could not be saved to Firestore. Please check Firebase settings and Firestore Rules.",
          "error"
        );

      }


      saveBtn.disabled = false;

      saveBtn.textContent = "Save Profile";

    });


    // ==========================================
    // SIGN OUT
    // ==========================================

    logoutBtn.addEventListener("click", async () => {

      try {

        await signOut(auth);

        window.location.href = "index.html";

      } catch (error) {

        console.error(error);

        showMessage(
          "Could not sign out.",
          "error"
        );

      }

    });

  </script>

</body>
</html>
